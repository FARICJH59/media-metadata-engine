name = "media-metadata-engine"
main = "src/index.ts"
compatibility_date = "2026-10-02"

# Configure a real database ID before deployment. CI rejects this placeholder.
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "spatial-audio-ingest"

[[queues.producers]]
queue = "audio-processing-queue"
binding = "PROCESSING_QUEUE"

[[queues.consumers]]
queue = "audio-processing-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5

[[d1_databases]]
binding = "DB"
database_name = "media_metadata_db"
database_id = "YOUR_D1_DATABASE_ID"

[vars]
MAX_UPLOAD_BYTES = "26214400"
