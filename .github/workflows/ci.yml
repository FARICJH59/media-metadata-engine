name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Validate D1 deployment placeholder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if grep -q 'YOUR_D1_DATABASE_ID' wrangler.toml; then
            echo "::error::Replace the D1 database ID before production deployment."
            exit 1
          fi
